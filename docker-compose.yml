services:
  mysql:
    image: mysql:8.0
    container_name: buckshot-mysql
    ports:
      - "3307:3306" # 로컬 MySQL 서비스가 3306을 쓰는 경우를 피한다
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: buckshot_roulette
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: buckshot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
